<!-- <!DOCTYPE html>

    <h3>MIXED NUMBER PROCESSOR</h3>

    <button onclick="processNumbers()">Click krrrrrrr</button>
    <h3 id="result"></h3>

    <script>
        function processNumbers() {
            
            let numbers = [5, -3, 8, -1, 4, 2];

            let positiveNumbers = numbers.filter(num => num >= 0);

            let multipliedNumbers = positiveNumbers.map(num => num * 2);

            let sum = multipliedNumbers.reduce((acc, curr) => acc + curr, 0);
